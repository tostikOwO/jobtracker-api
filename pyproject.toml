[project]
name = "jobtracker-api"
version = "0.1.0"
description = "Учёт вакансий и откликов: FastAPI + SQLAlchemy 2.0 + PostgreSQL"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.5",
    "alembic>=1.13",
    "pyjwt>=2.15.1",
    "argon2-cffi>=25.1.0",
    "email-validator>=2.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx2>=0.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
